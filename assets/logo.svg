<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Snapcase</title>
  <defs>
    <linearGradient id="sc-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A45FF" />
      <stop offset="0.55" stop-color="#9B3DE8" />
      <stop offset="1" stop-color="#FF5A6E" />
    </linearGradient>
    <linearGradient id="sc-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- handle -->
  <path d="M45 40 V27 a11 11 0 0 1 11 -11 h16 a11 11 0 0 1 11 11 V40" fill="none" stroke="#7B55FF" stroke-width="9" stroke-linecap="round" />
  <!-- case body -->
  <rect x="8" y="34" width="112" height="86" rx="24" fill="url(#sc-body)" />
  <rect x="8" y="34" width="112" height="30" rx="24" fill="url(#sc-lid)" />
  <!-- viewfinder corners -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 64 V56 a4 4 0 0 1 4 -4 h8" />
    <path d="M88 52 h8 a4 4 0 0 1 4 4 v8" />
    <path d="M100 92 v8 a4 4 0 0 1 -4 4 h-8" />
    <path d="M40 104 h-8 a4 4 0 0 1 -4 -4 v-8" />
  </g>
  <!-- lens -->
  <circle cx="64" cy="78" r="17" fill="#FFFFFF" />
  <circle cx="64" cy="78" r="10" fill="#24135F" />
  <circle cx="60" cy="74" r="3.2" fill="#FFFFFF" />
  <!-- flash spark -->
  <path d="M106 14 L109.2 22.8 L118 26 L109.2 29.2 L106 38 L102.8 29.2 L94 26 L102.8 22.8 Z" fill="#FFC93C" stroke="#24135F" stroke-width="2.5" stroke-linejoin="round" />
</svg>
